---
run_on_simulator: false

# authentification vars for vmware_rest lookup plugin
connection_args:
  vcenter_hostname: "{{ vmware_ops_hostname }}"
  vcenter_username: "{{ vmware_ops_username }}"
  vcenter_password: "{{ vmware_ops_password }}"
  vcenter_validate_certs: "{{ vmware_ops_validate_certs }}"

test_vm_name: "{{ tiny_prefix }}-deploy-ovf-vm"

# Provision VM
provision_vm_cluster: "{{ vcenter_cluster_name }}"
provision_vm_folder: "/{{ vcenter_datacenter }}/vm/e2e-qe"
provision_vm_datacenter: "{{ vcenter_datacenter }}"
provision_vm_state: "poweredoff"
provision_vm_cdrom: []
provision_vm_networks:
  - name: "{{ vm_network_name }}"
    device_type: "vmxnet3"
    type: "dhcp"
provision_vm_resource_pool: null
provision_vm_hardware:
  memory_mb: 2000
  num_cpus: 4
  boot_firmware: efi
  secure_boot: true
provision_vm_guest_id: "rhel9_64Guest"
provision_vm_datastore: "{{ shared_storage_01 }}"

# Export VM as OVF to the local file system
export_vm_as_ovf_datacenter: "{{ vcenter_datacenter }}"
export_vm_as_ovf_export_dir: "/tmp/deploy_ovf_test"
export_vm_as_ovf_vm_name: "{{ test_vm_name }}"

# Deploy VM from OVF
deploy_ovf_datacenter_name: "{{ vcenter_datacenter }}"
deploy_ovf_cluster_name: "{{ vcenter_cluster_name }}"
deploy_ovf_folder: "/{{ vcenter_datacenter }}/vm/e2e-qe"
deploy_ovf_datastore: "{{ shared_storage_01 }}"
deploy_ovf_power_on: false

vm_power_status: "{{ 'poweredOn' if deploy_ovf_power_on else 'poweredOff' }}"

ovf_library: "{{ tiny_prefix }}-deploy-ovf-test-library"
ovf_library_item_name: "{{ tiny_prefix }}-deploy-ovf-test-template"

vm_name_local_ovf: "{{ tiny_prefix }}-deploy-ovf-test-from-local-ovf"
ovf_template_local: "{{ export_vm_as_ovf_export_dir}}/{{ test_vm_name }}/{{ test_vm_name }}.ovf"

vm_name_content_library: "{{ tiny_prefix }}-deploy-ovf-test-from-content-library"
ovf_template_content_library: "{{ ovf_library_item_name }}"
