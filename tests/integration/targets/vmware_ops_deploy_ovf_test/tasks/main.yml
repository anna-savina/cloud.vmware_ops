---
- name: Setup
  when: not run_on_simulator
  block:
    - name: Import common vars
      ansible.builtin.include_vars:
        file: ../group_vars.yml

    - name: Create Test VM
      ansible.builtin.include_role:
        name: cloud.vmware_ops.provision_vm
      vars:
        provision_vm_name: "{{ test_vm_name }}"

    - name: Test Export VM As OVF
      ansible.builtin.import_role:
        name: cloud.vmware_ops.export_vm_as_ovf

    - name: Create Content Library
      vmware.vmware_rest.content_locallibrary:
        vcenter_hostname: "{{ vmware_ops_hostname }}"
        vcenter_username: "{{ vmware_ops_username }}"
        vcenter_password: "{{ vmware_ops_password }}"
        vcenter_validate_certs: "{{ vmware_ops_validate_certs }}"
        name: "{{ ovf_library }}"
        description: automated
        publish_info:
          published: true
          authentication_method: 'NONE'
        storage_backings:
          - datastore_id: "{{ lookup('vmware.vmware_rest.datastore_moid', '/' + vcenter_datacenter + '/' + deploy_ovf_datastore, **connection_args) }}"
            type: "DATASTORE"
        state: present
      register: lib_info

    - name: Export VM As OVF To Content Library
      ansible.builtin.import_tasks: export_vm_as_ovf_content_library.yml
      vars:
        lib_id: "{{ lib_info.id }}"

  always:
    - name: Delete Test VM
      ansible.builtin.include_role:
        name: cloud.vmware_ops.provision_vm
      vars:
        provision_vm_name: "{{ test_vm_name }}"
        provision_vm_state: "absent"
        provision_vm_force: true

- name: Test
  when: not run_on_simulator
  block:
    - name: Test Deploy OVF From Local Filesystem
      ansible.builtin.import_role:
        name: cloud.vmware_ops.deploy_ovf
      vars:
        deploy_ovf_vm_name: "{{ vm_name_local_ovf }}"
        deploy_ovf_template: "{{ ovf_template_local }}"

    - name: Test Deploy OVF From Content Library
      ansible.builtin.import_role:
        name: cloud.vmware_ops.deploy_ovf
      vars:
        deploy_ovf_vm_name: "{{ vm_name_content_library }}"
        deploy_ovf_template: "{{ ovf_template_content_library }}"
        deploy_ovf_library: "{{ ovf_library }}"

    - name: Check VMs Properties
      ansible.builtin.include_tasks: test_deploy_ovf.yml
      loop:
        - "{{ vm_name_local_ovf }}"
        - "{{ vm_name_content_library }}"

  always:
    - name: Delete Test VMs
      ansible.builtin.include_role:
        name: cloud.vmware_ops.provision_vm
      vars:
        provision_vm_name: "{{ item }}"
        provision_vm_state: "absent"
        provision_vm_force: true
      loop:
        - "{{ vm_name_local_ovf }}"
        - "{{ vm_name_content_library }}"

    - name: Delete OVF On Local Filesystem
      ansible.builtin.file:
        state: absent
        path: "{{ ovf_template_local | dirname }}"

    - name: Remove Content Library
      vmware.vmware_rest.content_locallibrary:
        vcenter_hostname: "{{ vmware_ops_hostname }}"
        vcenter_username: "{{ vmware_ops_username }}"
        vcenter_password: "{{ vmware_ops_password }}"
        vcenter_validate_certs: "{{ vmware_ops_validate_certs }}"
        library_id: "{{ lib_info.id }}"
        state: absent
      when: lib_info is defined
